# DayNest Nginx site
# Place at: /etc/nginx/sites-available/daynest.conf
# Symlink:  ln -s /etc/nginx/sites-available/daynest.conf /etc/nginx/sites-enabled/

# ---- HTTP -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name daynest.example.com;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daynest.example.com;

    # Adjust paths after certbot runs
    ssl_certificate     /etc/letsencrypt/live/daynest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daynest.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml+rss
        application/manifest+json image/svg+xml font/ttf font/otf;

    client_max_body_size 50M;

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /healthz {
        proxy_pass         http://127.0.0.1:3000/healthz;
        access_log         off;
    }

    # ---- static SPA ----
    root /var/www/daynest/web;
    index index.html;

    # Cache hashed assets for a year
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (index.html is never cached so deploys propagate)
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
}
